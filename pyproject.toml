[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptdiff"
version = "0.1.0"
description = "A regression harness for prompt changes: run a fixed evaluation suite across prompt versions and report semantic deltas, not just text diffs."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Prabesh Sharma" }]
requires-python = ">=3.10"
keywords = [
    "prompt-engineering",
    "llm",
    "testing",
    "regression-testing",
    "evaluation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.18",
]

[project.urls]
Homepage = "https://github.com/hellpuffyt/promptdiff"
Issues = "https://github.com/hellpuffyt/promptdiff/issues"

[project.scripts]
promptdiff = "promptdiff.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/promptdiff"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
strict = true
python_version = "3.10"
packages = ["promptdiff"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
