name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -v

  lint:
    name: lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check .

      - name: Run mypy
        run: mypy

  smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install .

      - name: "Run example suite against v1 (expected to fail: one seeded bug)"
        run: |
          promptdiff run \
            --suite examples/suite.yaml \
            --fixtures examples/fixtures \
            --version v1 || test $? -eq 1

      - name: Compare v1 vs v2 (expected regressions, exit 1)
        run: |
          promptdiff compare \
            --suite examples/suite.yaml \
            --fixtures examples/fixtures \
            --base v1 --head v2 || test $? -eq 1

      - name: Compare v1 vs v2 with --allow-regression (expected exit 0)
        run: |
          promptdiff compare \
            --suite examples/suite.yaml \
            --fixtures examples/fixtures \
            --base v1 --head v2 \
            --allow-regression --format json
